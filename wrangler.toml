name = "jot"
main = "src/index.js"
compatibility_date = "2026-08-01"

# The workers.dev hostname is derived from the account, so it publishes the
# account's email local-part in a URL anyone can see. A custom domain hides that
# and is the only address the webhook needs.
routes = [
  { pattern = "jot.an8kk.dev", custom_domain = true }
]

# Stated rather than defaulted. Preview URLs would publish an extra address per
# version, and every additional public surface is one more door on a bot that
# only ever needs one. The secret_token check defends them, but fewer doors is
# better than more.
workers_dev = false
preview_urls = false

# This file is committed, so it holds nothing personal. OWNER_CHAT_ID is not
# secret in any real sense, but it is a personal identifier and does not belong
# in a public repository, so it goes in with the secrets.
#
#   wrangler secret put TELEGRAM_TOKEN
#   wrangler secret put GH_PAT
#   wrangler secret put WEBHOOK_SECRET
#   wrangler secret put OWNER_CHAT_ID
#   wrangler secret put TASK_REPO
#
# Optional. A Telegram file_id sent to anyone who is not the owner, on /start
# only. Leave unset and the bot stays silent to strangers.
#   wrangler secret put STRANGER_PHOTO

# Optional. A classic PAT with the `notifications` scope, nothing else. GitHub's
# notification endpoints reject fine-grained tokens outright, which is why this
# cannot reuse GH_PAT. Leave unset and the schedule does nothing.
#   wrangler secret put GH_NOTIFY_TOKEN

# Whose own comments to ignore. Not secret: it is the public account name, and
# the alternative is an extra API call on every poll to ask GitHub who we are.
[vars]
GH_LOGIN = "tempoloss"

# 59 runs an hour, not 60. GitHub's X-Poll-Interval is 60 seconds and cron fires
# on the minute rather than exactly every 60 seconds, so sitting on the limit
# would cross it on jitter alone. The skipped minute is the margin.
[triggers]
crons = ["0-58 * * * *"]
