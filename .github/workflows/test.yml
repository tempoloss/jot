name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The parser is a pure function with no network, so the suite is fast and
      # runs on Node's built-in test runner — no install step, no dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test test/*.test.js
